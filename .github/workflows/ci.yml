name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: yeahub-practice:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          API_URL: ${{ vars.API_URL }}
      - name: Prepare release archive
        run: tar -czf "yeahub-${GITHUB_SHA}.tar.gz" dist
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Deploy static build
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          archive="yeahub-${GITHUB_SHA}.tar.gz"
          remote_archive="/tmp/${archive}"
          scp -P "$DEPLOY_PORT" "$archive" "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH' && tar -xzf '$remote_archive' --strip-components=1 -C '$DEPLOY_PATH' && rm -f '$remote_archive'"
      - name: Check production
        if: vars.PRODUCTION_URL != ''
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.PRODUCTION_URL }}"
